# Publishes web/ to GitHub Pages. The photo model lives in model/ (source of truth) and is
# copied next to the page, as `python -m taupin` does locally.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/test/*.test.mjs
      - name: Build site
        run: |
          cp -r web _site
          rm -rf _site/test
          mkdir -p _site/model
          cp model/taupin.onnx model/labels.json model/metrics.json model/MODEL_CARD.md _site/model/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
